<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Campus+</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><svg class="logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#202020"/><circle cx="15" cy="15" r="7.2" fill="none" stroke="#fff" stroke-width="3.2"/><path d="m17.2 18.6 3.3 3.4 6-7.2" fill="none" stroke="#3fd07f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Campus+</b></header>
  <section aria-labelledby="h-canvas">
    <h2 id="h-canvas">No Canvas</h2>
    <div class="list">
      <label class="row"><span>Tema</span>
        <select id="theme"><option value="off">Claro (do Canvas)</option><option value="dark">Escuro</option><option value="auto">Igual ao sistema</option></select></label>
      <label class="row"><span>Semana: entregas e provas</span><input type="checkbox" role="switch" data-pref="week"></label>
      <label class="row"><span>Avisos de todas as matérias</span><input type="checkbox" role="switch" data-pref="news"></label>
      <label class="row"><span>Lembretes <small>1 dia e 1 hora antes</small></span><input type="checkbox" role="switch" data-pref="remind"></label>
      <label class="row"><span>Quanto falta nas matérias</span><input type="checkbox" role="switch" data-pref="grades"></label>
      <label class="row"><span>Baixar arquivos da matéria</span><input type="checkbox" role="switch" data-pref="files"></label>
    </div>
    <p class="fine">O tema muda na hora; o resto, ao recarregar o Canvas.</p>
  </section>
  <section aria-labelledby="h-notas">
    <h2 id="h-notas">Calculadora</h2>
    <p id="status" role="status">Abra o Canvas da PUCPR uma vez para ler suas notas.</p>
    <div class="acts">
      <button id="open" class="primary" type="button">Abrir o Campus+</button>
      <button id="canvas" type="button">Abrir o Canvas</button>
    </div>
  </section>
  <footer><span>Só lê os seus dados do Canvas, com o login que você já tem. Nada é enviado para servidor nenhum.</span><span id="ver"></span></footer>
  <script src="prefs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
