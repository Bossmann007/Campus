<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Campus+</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><svg class="logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#202020"/><circle cx="15" cy="15" r="7.2" fill="none" stroke="#fff" stroke-width="3.2"/><path d="m17.2 18.6 3.3 3.4 6-7.2" fill="none" stroke="#3fd07f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Campus+</b></header>
  <section class="mods" aria-label="O que o Campus+ faz no Canvas">
    <label class="row">Tema
      <select id="theme"><option value="off">Claro (do Canvas)</option><option value="dark">Escuro</option><option value="auto">Igual ao sistema</option></select></label>
    <label class="row"><span>Semana: entregas e provas</span><input type="checkbox" data-pref="week"></label>
    <label class="row"><span>Avisos de todas as matérias</span><input type="checkbox" data-pref="news"></label>
    <label class="row"><span>Lembretes (1 dia e 1 hora antes)</span><input type="checkbox" data-pref="remind"></label>
    <label class="row"><span>Quanto falta nas matérias</span><input type="checkbox" data-pref="grades"></label>
    <label class="row"><span>Baixar arquivos da matéria</span><input type="checkbox" data-pref="files"></label>
    <p class="fine">O tema muda na hora; o resto, ao recarregar o Canvas.</p>
  </section>
  <p id="status">Levar as notas para o app: abra o Canvas da PUCPR e clique em Importar.</p>
  <div class="acts">
    <button id="go" class="primary" type="button">Importar notas do Canvas</button>
    <button id="open" type="button" hidden>Abrir no Campus+</button>
    <button id="copy" type="button" hidden>Copiar</button>
  </div>
  <p class="fine"><span id="ver"></span> Só lê os seus dados do Canvas, com o login que você já tem. Nada é enviado para servidor nenhum.</p>
  <script src="prefs.js"></script>
  <script src="collect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
